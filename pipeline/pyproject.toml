[project]
name = "classification-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.6",
  "lightgbm",
  "tabicl",
  "imbalanced-learn>=0.14",
  "pyreadstat",
  "requests",
  "torch",
]

[tool.uv]
package = false

# TabICL needs a CUDA build of PyTorch. The cu128 wheels cover recent GPUs (including Blackwell / RTX 50xx).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
